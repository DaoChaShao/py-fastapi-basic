[project]
name = "py-fastapi-basic"
version = "0.1.0"
description = "FastAPI application with basic knowledge"
authors = [{ name = "Your Name" }]
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "fastapi>=0.141.1",
    "greenlet>=3.5.5",
    "sqlalchemy>=2.0.52",
    "uvicorn>=0.52.4",
]

[tool.git-changelog]
bump = "auto"
convention = "conventional"
in-place = false
filter-commits = ""
marker-line = "<!-- insertion marker for GitHub -->"
output = "CHANGELOG.md"
parse-refs = true
parse-trailers = true
provider = "github"
repository = "."
sections = ["feat", "fix", "chore", "docs", "perf", "build", "refactor", "test", "deps"]
template = "angular"
version-regex = "^## \\[(?P<version>v?[^\\]]+)"
versioning = "semver"
zerover = false

[dependency-groups]
dev = [
    "black>=26.5.1",
    "git-changelog>=2.9.7",
    "ruff>=0.16.5",
]
